name: CI
on: [push]
jobs:
  build:
    name: Build and test multilisten package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '>=1.25.3'
          check-latest: true
      - run: go build ./pkg/multilisten
      - run: go test -cover ./pkg/multilisten
